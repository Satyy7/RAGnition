  - id: EVAL-118
    title: Pods slow to start, flag fetch timeouts
    reported_at: "2027-01-09T10:00:00Z"
    answerable: true
    reasoning: multi-hop
    tags: [shared-infra, recent-distractor]
    incident:
      reporter_note: >-
        Since yesterday new pods in checkout and search take minutes to become ready, and some
        features flicker. Checkout deployed saved cards this morning.
      alerts:
        - "FlagFetchErrors: 4 services reporting flag fetch timeouts"
        - "KubeDeploymentRolloutStuck: checkout-api"
      logs:
        - '2027-01-09T09:31:12Z checkout-api WARN FlagClient - fetch timed out after 2000ms (attempt 3)'
        - '2027-01-09T09:31:40Z feature-flags INFO requests_per_s=412 p99_ms=2840 cpu=98%'
    label:
      culprit_service: feature-flags
      category: config change / self-inflicted load
      root_cause: >-
        CHG-2395 made every flag client poll once a second instead of every 30 s, a roughly 30-fold
        load increase on a flag service sized for the old interval; it saturates, fetches time out
        and pods wait for flags at startup.
      key_facts:
        - feature-flags handles about 412 req/s (sized for about 13 at a 30 s interval) at 98% CPU.
        - CHG-2395 lowered the polling interval for all clients via the server setting.
        - Clients fall back to defaults when fetches fail (PM-2026-011).
      supporting_doc_ids: [kestrel/change/CHG-2395, kestrel/postmortem/PM-2026-011, kestrel/service/feature-flags]
      root_cause_change: CHG-2395
      expected_fix: Restore the 30 s interval (use push or a separate kill-switch channel instead).

  - id: EVAL-119
    title: All payments rejected by Paygate
    reported_at: "2027-01-11T08:00:00Z"
    answerable: true
    reasoning: single-hop
    tags: [hop-0, lexical-distractor]
    incident:
      reporter_note: >-
        Every payment has failed since about 22:05 last night. The Paygate CA bundle was updated for
        G3 in November and the client certificate is valid for another 80 days.
      alerts:
        - "PaymentsErrorRateHigh: payments-api 5xx ratio 100%"
      logs:
        - '2027-01-10T22:05:31Z payments-api level=error msg="paygate authorize" err="remote error: tls: unknown certificate authority"'
        - 'openssl x509 -in paygate-client.crt -noout -issuer -enddate: issuer=CN=Kestrel Internal CA v2, notAfter=Apr 10 22:00:00 2027 GMT'
    label:
      culprit_service: payments-api
      category: infra change / client certificate trust
      root_cause: >-
        CHG-2399 had cert-manager re-issue the Paygate client certificate from the new internal CA,
        which Paygate does not trust; Paygate rejects the mutual-TLS handshake from the moment the
        new certificate was loaded.
      key_facts:
        - The error comes from Paygate's side (remote error, unknown certificate authority).
        - The client certificate is now issued by Kestrel Internal CA v2 since 2027-01-10 22:00 (CHG-2399).
        - Paygate only accepts certificates from Kestrel Partner CA; the server-chain issue (CHG-2302) is unrelated.
      supporting_doc_ids: [kestrel/change/CHG-2399, kestrel/postmortem/PM-2025-015, kestrel/service/payments-api]
      root_cause_change: CHG-2399
      expected_fix: Re-issue paygate-client from the Kestrel Partner CA issuer and exclude it from the CA consolidation.

  - id: EVAL-120
    title: Stock check failing with database errors
    reported_at: "2027-01-13T18:30:00Z"
    answerable: true
    reasoning: single-hop
    tags: [hop-0]
    incident:
      reporter_note: >-
        January sale evening. Checkout fails at the stock check for about 12% of customers.
        inventory-api scaled out to many pods.
      alerts:
        - "CheckoutErrorRateHigh: 12%"
        - "InventoryErrorRateHigh: inventory-api 5xx 13%"
      logs:
        - '2027-01-13T18:12:03Z inventory-api ERROR asyncpg.exceptions.TooManyConnectionsError: sorry, too many clients already'
        - 'kubectl get hpa inventory-api: REPLICAS 21, MINPODS 3, MAXPODS 24'
    label:
      culprit_service: inventory-api
      category: capacity / database connections
      root_cause: >-
        Raising the inventory-api HPA ceiling to 24 (CHG-2401) lets the sale scale it to 21 pods with
        10 connections each, past inventory-db's limit of 150 connections, so new connections are
        refused and availability calls fail.
      key_facts:
        - 21 replicas x 10 connections = 210 > max_connections 150.
        - CHG-2401 raised the HPA maximum from 8 to 24 without changing the pool.
      supporting_doc_ids: [kestrel/change/CHG-2401, kestrel/service/inventory-api]
      root_cause_change: CHG-2401
      expected_fix: Cap replicas so the pools fit, or add a pooler in front of inventory-db.

  - id: EVAL-121
    title: Customers signed out after card authentication
    reported_at: "2027-01-15T20:00:00Z"
    answerable: true
    reasoning: multi-hop
    tags: [hop-1, culprit-unnamed, recent-distractor]
    incident:
      reporter_note: >-
        Customers paying by card are sent to the sign-in page when they come back from their bank's
        verification step, and the order is lost. Storefront changed footer links today.
      alerts:
        - "CheckoutConversionDrop: card payments completion -37%"
      logs:
        - '2027-01-15T19:41:20Z web-storefront INFO GET /checkout/return 302 -> /signin reason=no_session_cookie referer=https://acs.examplebank.example/'
    label:
      culprit_service: auth-service
      category: config change / cookie policy
      root_cause: >-
        CHG-2403 made the session cookie SameSite=Strict, and browsers do not send Strict cookies on
        the cross-site redirect back from the bank's 3-D Secure page, so the storefront sees no
        session at /checkout/return.
      key_facts:
        - The return request comes from the bank's site and arrives without the session cookie.
        - CHG-2403 changed SameSite from Lax to Strict; Lax was chosen for this redirect.
      supporting_doc_ids: [kestrel/change/CHG-2403, kestrel/service/auth-service, kestrel/service/web-storefront]
      root_cause_change: CHG-2403
      expected_fix: Revert the session cookie to SameSite=Lax.

  - id: EVAL-122
    title: Checkout delivery options timing out
    reported_at: "2027-01-17T13:00:00Z"
    answerable: true
    reasoning: multi-hop
    tags: [hop-1, recent-distractor]
    incident:
      reporter_note: >-
        The delivery step in checkout often shows "no delivery options". Checkout released promo
        code validation yesterday.
      alerts:
        - "CheckoutLatencyHigh: checkout-api p95 3.4s"
      logs:
        - '2027-01-17T12:31:09Z checkout-api WARN ShippingClient GET /v1/quotes timed out after 3000ms'
        - '2027-01-17T12:31:10Z shipping-api INFO quote carrierhub_ms=2710 cache=disabled'
        - '2027-01-17T12:31:11Z shipping-api WARN carrierhub status=429 rate_limited=true'
    label:
      culprit_service: shipping-api
      category: config change / cache disabled
      root_cause: >-
        With the carrier rate cache switched off (CHG-2406), every checkout quote goes live to
        CarrierHub; quotes now take close to 3 s and push the shared account into rate limiting, so
        checkout's 3 s quote call times out.
      key_facts:
        - Logs show cache=disabled and CarrierHub calls of about 2.7 s plus 429s.
        - CHG-2406 disabled the 15-minute rate cache (about 92% hit rate).
        - Quotes and labels share the 50 requests/s limit (PM-2026-010).
      supporting_doc_ids: [kestrel/change/CHG-2406, kestrel/service/shipping-api, kestrel/postmortem/PM-2026-010]
      root_cause_change: CHG-2406
      expected_fix: Re-enable the rate cache (shorter TTL if freshness matters).

  - id: EVAL-123
    title: Order emails bouncing
    reported_at: "2027-01-19T09:00:00Z"
    answerable: true
    reasoning: single-hop
    tags: [hop-0, rolled-back-distractor]
    incident:
      reporter_note: >-
        No order confirmations delivered since yesterday afternoon. There was a template engine
        release yesterday but it was rolled back.
      alerts:
        - "EmailSendFailures: 100% permanent failures"
      logs:
        - '2027-01-19T08:40:02Z notification-service error postrelay send failed status=550 reason="5.7.26 Unauthenticated email from mail.kestrel.example is not accepted"'
    label:
      culprit_service: notification-service
      category: config change / sender authentication
      root_cause: >-
        CHG-2410 moved the sender to the new mail.kestrel.example domain before its SPF and DKIM
        records existed, so PostRelay permanently rejects the unauthenticated messages.
      key_facts:
        - 550 5.7.26 for the new sender domain.
        - CHG-2410 changed the From domain while DNS records were only requested (NET-118).
        - The template engine release (CHG-2409) was rolled back.
      supporting_doc_ids: [kestrel/change/CHG-2410, kestrel/service/notification-service]
      root_cause_change: CHG-2410
      expected_fix: Switch the sender back to orders@kestrel.example until SPF/DKIM are published; resend failed emails.

  - id: EVAL-124
    title: Product API slow
    reported_at: "2027-01-21T14:00:00Z"
    answerable: true
    reasoning: single-hop
    tags: [hop-0, after-distractor]
    incident:
      reporter_note: >-
        catalog-api p95 is 2.8 s since yesterday's release; product pages are slow.
      alerts:
        - "CatalogLatencyHigh: catalog-api p95 2.8s"
      logs:
        - 'pg_stat_statements: SELECT * FROM variant_attribute WHERE variant_id = $1 calls=48210331 mean_ms=1.9'
        - 'EXPLAIN SELECT * FROM variant_attribute WHERE variant_id = 9921: Seq Scan on variant_attribute (rows=3120440)'
    label:
      culprit_service: catalog-api
      category: deploy regression / N+1 query
      root_cause: >-
        catalog-api v8.9 (CHG-2413) loads attributes with a separate query for each variant, and that
        query has no index on variant_id, so each product request runs many sequential scans.
      key_facts:
        - Tens of millions of per-variant attribute queries, each a Seq Scan.
        - CHG-2413 added one query per variant to the product response.
        - The index (CHG-2414) is dated after the incident; PM-2025-024 required EXPLAIN plans for hot queries.
      supporting_doc_ids: [kestrel/change/CHG-2413, kestrel/service/catalog-api, kestrel/postmortem/PM-2025-024]
      root_cause_change: CHG-2413
      expected_fix: Roll back v8.9 or batch the attribute query, and add the variant_id index.

  - id: EVAL-125
    title: Checkout rejecting payments under load
    reported_at: "2027-01-23T19:00:00Z"
    answerable: true
    reasoning: multi-hop
    tags: [hop-1, recent-distractor]
    incident:
      reporter_note: >-
        Checkout returns 503 for about a quarter of orders at the payment step. Paygate's status page
        says "degraded performance". Checkout added promo code validation last week.
      alerts:
        - "CheckoutErrorRateHigh: 24%"
      logs:
        - '2027-01-23T18:44:01Z checkout-api ERROR PaymentExecutor - rejected: pool exhausted (active=50, queue=0)'
        - '2027-01-23T18:44:02Z payments-api level=info msg="paygate authorize" latency_ms=13870'
    label:
      culprit_service: payments-api
      category: config change / timeout amplification
      root_cause: >-
        Raising the Paygate request timeout to 15 s (CHG-2417) means that during Paygate's slowdown
        each payment holds a checkout worker thread for up to 15 s instead of failing fast at 2 s;
        checkout's 50 payment threads fill up and new payments are rejected.
      key_facts:
        - payments-api waits almost 14 s for Paygate; checkout's 50-thread payment pool is exhausted.
        - CHG-2417 raised the timeout from 2 s to 15 s the day before.
      supporting_doc_ids: [kestrel/change/CHG-2417, kestrel/service/payments-api, kestrel/service/checkout-api]
      root_cause_change: CHG-2417
      expected_fix: Restore the 2 s timeout (or add a circuit breaker on Paygate calls).

  - id: EVAL-126
    title: Reservations and availability slowing down
    reported_at: "2027-01-25T16:00:00Z"
    answerable: true
    reasoning: multi-hop
    tags: [hop-0, old-culprit, recent-distractor]
    incident:
      reporter_note: >-
        Reservation lag has been creeping up for days and availability calls got slower each week.
        inventory-api changed its log format yesterday and the consumer membership today.
      alerts:
        - "ReservationLagHigh: inventory-reserver lag 22m"
        - "InventoryLatencyHigh: /v2/availability p95 640ms"
      logs:
        - 'inventory-db: SELECT relname, n_live_tup, n_dead_tup, last_autovacuum FROM pg_stat_user_tables -> reservations 2,104,331 | 412,880,120 | 2026-12-11 23:10'
        - 'inventory-db: reservations total size 61 GB'
    label:
      culprit_service: inventory-api
      category: config change / table bloat
      root_cause: >-
        Autovacuum on the reservations table was switched off for the stock import (CHG-2364) six
        weeks ago and never turned back on; with millions of updates a day, dead rows piled up and
        the bloated table makes every reservation and availability query slower.
      key_facts:
        - 412M dead tuples and 61 GB; last autovacuum on 2026-12-11.
        - CHG-2364 disabled autovacuum on reservations, to be re-enabled after the import (FUL-401).
        - Slow per-message processing leads to lag as in PM-2025-019.
      supporting_doc_ids: [kestrel/change/CHG-2364, kestrel/service/inventory-api, kestrel/postmortem/PM-2025-019]
      root_cause_change: CHG-2364
      expected_fix: Re-enable autovacuum, run VACUUM (or pg_repack) on reservations.

