        - "catalog-db pg_locks: 1 granted RowExclusiveLock on product_variant held 00:24:10 by pid 41212 (flyway); 380 waiting"
    label:
      culprit_service: catalog-api
      category: migration / table locks
      root_cause: >-
        Migration V93 (CHG-2386) rewrites every product_variant row in one long transaction, holding
        row locks for its whole duration; reads that need those rows wait, hit the lock timeout, and
        storefront calls to catalog-api time out.
      key_facts:
        - A Flyway session has held locks on product_variant for 24 minutes.
        - CHG-2386 backfills all 42M rows in a single transaction at deploy.
        - The storefront deploy (CHG-2387) does not touch product pages.
      supporting_doc_ids: [kestrel/change/CHG-2386, kestrel/service/catalog-api]
      root_cause_change: CHG-2386
      expected_fix: Cancel the migration transaction; redo the backfill in small batches.

  - id: EVAL-116
    title: Orders not handed to the warehouse
    reported_at: "2027-01-05T16:00:00Z"
    answerable: true
    reasoning: multi-hop
    tags: [hop-1, recent-distractor]
    incident:
      reporter_note: >-
        Since early afternoon no orders reach the warehouse. Labels seem to be created fine.
        order-worker concurrency was raised yesterday.
      alerts:
        - "OrderHandoffDelay: oldest order waiting 2h10m"
      logs:
        - "2027-01-05T13:44:02Z order-worker ERROR handoff failed order=K-9010021: KeyError: 'tracking_number'"
        - "2027-01-05T13:44:02Z order-worker INFO label created status=201 body_keys=[tracking_id, carrier, label_url]"
    label:
      culprit_service: shipping-api
      category: breaking API change
      root_cause: >-
        shipping-api v2.4 (CHG-2389) renamed the label response field that order-worker copies into
        the warehouse hand-off, so order-worker fails on the missing field even though labels are
        created successfully.
      key_facts:
        - Response keys now contain tracking_id instead of tracking_number.
        - order-worker requires tracking_number for the hand-off (service notes).
        - The concurrency change (CHG-2390) does not change the hand-off.
      supporting_doc_ids: [kestrel/change/CHG-2389, kestrel/service/shipping-api, kestrel/service/order-worker]
      root_cause_change: CHG-2389
      expected_fix: Roll back shipping-api v2.4 or return both fields, then update order-worker.

  - id: EVAL-117
    title: Search slow, OpenSearch CPU high
    reported_at: "2027-01-07T12:00:00Z"
