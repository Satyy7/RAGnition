# ------------------------------------------------------------- past incidents
history:
  - id: PM-2025-007
    date: "2025-03-14"
    service: payments-api
    severity: SEV1
    title: Payment authorizations failing during spring sale
    duration_min: 47
    impact: About 18% of payment authorizations failed with HTTP 503 for 47 minutes at sale peak.
    detection: Alert PaymentsErrorRateHigh fired at 19:02; customers reported failed payments.
    trigger: payments-api was scaled to 12 replicas for the sale (CHG-2101), doubling client connection demand.
    root_cause: >-
      Peak concurrent demand from 12 replicas (up to 240 client connections) far exceeded PgBouncer
      default_pool_size of 30 server connections.
      Requests queued waiting for a server connection at PgBouncer (cl_waiting climbed above 150)
      and timed out in payments-api after 5 s, which returned 503.
    resolution: PgBouncer default_pool_size raised from 30 to 60 and replicas reduced to 8.
    contributing_factors:
      - No alert on PgBouncer cl_waiting.
      - Capacity plan scaled the application but not the connection pooler.
    timeline:
      - "19:00 sale traffic ramps up"
      - "19:02 PaymentsErrorRateHigh fires"
      - "19:15 logs show 'timeout acquiring connection from pool'"
      - "19:31 PgBouncer SHOW POOLS shows cl_waiting 160"
      - "19:49 replicas reduced, errors recover"
    action_items:
      - Alert when PgBouncer cl_waiting > 0 for 2 minutes (done).
      - Capacity rule - replicas x app pool size must fit within default_pool_size plus headroom (done, in runbook).
    related_changes: [CHG-2101]

  - id: PM-2025-011
    date: "2025-06-02"
    service: search-api
    severity: SEV2
    title: Search cluster yellow, new products missing from search
    duration_min: 190
    impact: New and updated products did not appear in search for about 3 hours; search itself stayed up.
    detection: SearchIndexLag alert after 40 minutes.
    trigger: A reindex of products-* created a full second copy of the index.
    root_cause: >-
      The temporary duplicate index pushed two data nodes over the 90% high disk watermark, so OpenSearch
      stopped allocating shards to them; replicas of new indices stayed unassigned and indexing stalled.
    resolution: Deleted the old index after alias switch; disk returned to 61%.
    contributing_factors:
      - No disk usage alert below the watermark.
    timeline:
      - "10:05 reindex job started"
      - "10:48 SearchIndexLag fires"
      - "11:30 _cluster/allocation/explain shows high watermark exceeded"
      - "13:15 old index deleted, shards allocate"
    action_items:
      - Alert on data node disk above 80% (done).
      - Reindex runbook - check free disk is at least 2x index size first (done).

  - id: PM-2025-015
    date: "2025-07-21"
    service: payments-api
    severity: SEV1
    title: All payments failing - Paygate client certificate expired
    duration_min: 64
    impact: 100% of payment authorizations failed for 64 minutes.
    detection: PaymentsErrorRateHigh at 00:01 UTC.
    trigger: The client certificate used for mutual TLS with Paygate expired at 00:00 UTC.
    root_cause: >-
      The Paygate client certificate was renewed manually once a year; the calendar reminder went to a
      former employee. Paygate rejected the TLS handshake with 'certificate expired'.
    resolution: Emergency renewal via Paygate portal; secret updated and pods restarted.
    contributing_factors:
      - Manual renewal process with a single owner.
      - No expiry monitoring for external certificates.
    timeline:
      - "00:00 certificate expires"
      - "00:01 PaymentsErrorRateHigh fires; logs show 'remote error: tls: expired certificate'"
      - "00:40 new certificate issued"
      - "01:04 pods restarted, recovery"
    action_items:
      - Move Paygate client certificate to cert-manager (done, CHG-2150).
      - Alert 21 days before any certificate in payments-api expires, including trust bundle entries (done).
      - Review vendor notices for certificate and CA changes in the weekly Payments sync (done).

  - id: PM-2025-019
    date: "2025-09-09"
    service: inventory-api
    severity: SEV2
    title: Stock reservations delayed by up to 2 hours
    duration_min: 140
    impact: Orders were accepted but stock reservations lagged by up to 2 hours; 312 orders oversold.
    detection: ReservationLagHigh alert.
    trigger: An inventory-db slow query (missing statistics after bulk import) made each message take about 1 s.
    root_cause: >-
      With max.poll.records=500, one poll batch took about 500 s, longer than max.poll.interval.ms
      (300 s). The consumer was removed from the group, partitions rebalanced, the uncommitted batch
      was re-delivered, and the cycle repeated, so lag only grew.
    resolution: ANALYZE on inventory-db restored query speed; lag drained in 25 minutes.
    contributing_factors:
      - Batch size chosen without considering worst-case per-message time.
    timeline:
      - "14:10 bulk import finishes"
      - "14:25 ReservationLagHigh fires"
      - "14:50 logs show CommitFailedError and repeated rebalances"
      - "16:05 ANALYZE run, processing time drops to 20 ms"
    action_items:
      - Reduce max.poll.records to 50 (FUL-312, open - deprioritised).
      - Alert on consumer group rebalance rate (done).

  - id: PM-2025-022
    date: "2025-11-28"
    service: cluster-dns
    severity: SEV2
    title: Intermittent timeouts across services on Black Friday
    duration_min: 55
    impact: 2-4% of requests across many services failed with connection or lookup timeouts.
    detection: Error-rate alerts in five services within minutes of each other.
    trigger: Black Friday peak traffic (about 9x baseline).
    root_cause: >-
      CoreDNS pods were CPU-throttled at peak. Because pods use ndots:5, each lookup of an external or
      partially qualified name generated several queries, multiplying DNS load. Saturated CoreDNS
      dropped queries and clients saw 'i/o timeout' on lookups.
    resolution: CoreDNS scaled from 3 to 8 replicas and CPU limits removed.
    contributing_factors:
      - Fixed CoreDNS replica count not tied to cluster size.
      - ndots:5 default amplifying queries.
    timeline:
      - "18:00 peak starts"
      - "18:06 alerts in checkout-api, payments-api, search-api, inventory-api, order-worker"
      - "18:20 common error 'lookup ... i/o timeout' identified"
      - "18:55 CoreDNS scaled, recovery"
    action_items:
      - Run cluster-proportional-autoscaler for CoreDNS with min 6 replicas (done).
      - Use fully-qualified names with trailing dot for hot external hosts (partly done).

  - id: PM-2025-024
    date: "2025-12-03"
    service: catalog-api
    severity: SEV3
    title: Product pages slow after variant attributes release
    duration_min: 95
    impact: Product page p95 rose from 0.4 s to 3.8 s.
    detection: StorefrontLatencyHigh alert.
    trigger: Release 7.9 added queries filtering product_variant by a new color_code column.
    root_cause: >-
      The new column had no index, so each lookup sequentially scanned product_variant (then 35M rows).
    resolution: Created index CONCURRENTLY on color_code.
    contributing_factors:
      - Migration review did not include EXPLAIN plans for new hot queries.
    timeline:
      - "09:00 release 7.9 deployed"
      - "09:20 StorefrontLatencyHigh fires"
      - "10:10 pg_stat_statements shows seq scans on product_variant"
      - "10:35 index created, latency recovers"
    action_items:
      - Migration checklist - attach EXPLAIN for every hot query touching changed indexes or columns (done).

  - id: PM-2026-002
    date: "2026-01-19"
    service: checkout-api
    severity: SEV2
    title: Customers lost cart contents during January sale
    duration_min: 120
    impact: About 6% of active carts disappeared; customers had to rebuild them.
    detection: Customer support tickets, then CartRecreateRate dashboard.
    trigger: Sale traffic filled cart-cache to maxmemory.
    root_cause: >-
      cart-cache used maxmemory-policy allkeys-lru, so at maxmemory Redis evicted active cart keys
      along with stale data.
    resolution: Memory raised from 2 GB to 4 GB; policy changed to volatile-lru with TTLs on all keys (CHG-2201).
    contributing_factors:
      - Mixed long-lived and disposable data in one Redis without TTL discipline.
    timeline:
      - "11:00 sale starts"
      - "11:40 first support tickets"
      - "12:30 evicted_keys counter found climbing"
      - "13:00 memory increased"
    action_items:
      - Every key written to cart-cache must have a TTL; volatile-lru only evicts keys with TTL (done, CHG-2201).
      - Alert when used_memory exceeds 85% of maxmemory (done).

  - id: PM-2026-004
    date: "2026-02-27"
    service: notification-service
    severity: SEV3
    title: Order confirmation emails delayed during marketing campaign
    duration_min: 160
    impact: Confirmation emails delayed by up to 2.5 hours.
    detection: EmailQueueBacklog alert.
    trigger: A marketing campaign used most of the shared PostRelay limit of 100 messages/s.
    root_cause: >-
      PostRelay returned 429; notification-service retried immediately without backoff, so retries
      consumed the remaining quota and kept the account throttled.
    resolution: Campaign paused; backlog drained.
    contributing_factors:
      - Shared rate limit between marketing and transactional email.
    timeline:
      - "15:00 campaign starts"
      - "15:20 EmailQueueBacklog fires"
      - "16:10 logs show 429 retry loops"
      - "17:40 backlog drained"
    action_items:
      - Retries with exponential backoff, jitter and Retry-After (done, CHG-2215).
      - Request a separate PostRelay sub-account for transactional email (open).

  - id: PM-2026-005
    date: "2026-04-29"
    service: order-worker
    severity: SEV2
    title: Orders stuck - order-worker in CrashLoopBackOff
    duration_min: 75
    impact: About 2,100 orders were delayed reaching the warehouse by up to 75 minutes.
    detection: OrderHandoffDelay alert.
    trigger: Spring promotion with gift messages and large multi-item orders.
    root_cause: >-
      Building fulfilment documents for large orders pushed peak memory to about 700 MB, over the 512Mi
      limit; pods were OOMKilled (exit code 137) and entered CrashLoopBackOff.
    resolution: Memory limit raised to 1Gi (CHG-2240).
    contributing_factors:
      - Limits sized from average usage, not peak.
    timeline:
      - "10:00 promotion starts"
      - "10:12 OrderHandoffDelay fires"
      - "10:20 kubectl describe shows Last State Terminated, Reason OOMKilled"
      - "11:15 new limit rolled out"
    action_items:
      - Size memory limits from p99 peak plus 30% headroom, never from averages (done, platform handbook).
    related_changes: [CHG-2240]

  - id: PM-2026-007
    date: "2026-06-16"
    service: web-storefront
    severity: SEV3
    title: Stale prices shown after price update
    duration_min: 210
    impact: Product pages showed old prices for up to 3.5 hours; checkout charged the correct price.
    detection: Customer support tickets.
    trigger: CDN rule cached rendered product pages for 4 hours.
    root_cause: >-
      A CDN rule intended for static assets also matched /p/* product pages, so rendered HTML with
      prices was cached at the edge.
    resolution: Rule scoped to /static; cache purged.
    timeline:
      - "08:00 price update published"
      - "09:30 support tickets about price mismatch"
      - "11:10 CDN rule identified"
      - "11:30 purge complete"
    action_items:
      - CDN rule changes need review by the Storefront team (done).
