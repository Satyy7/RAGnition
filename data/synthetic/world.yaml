# SYNTHETIC DATA. Kestrel Commerce is a fictional company. Every service, person,
# incident and change below is invented for RAGnition's corpus.
#
# This file is what the company KNOWS: its services, its past incidents, and its
# change log. It becomes corpus documents. It must never contain the answers to
# the evaluation incidents in data/eval/scenarios.yaml: the change log records
# what was changed, in neutral words, never "this caused the outage".

company:
  name: Kestrel Commerce
  description: >-
    Fictional online retailer of home goods selling in the EU and US, about 40k
    orders per day, peaking around 9x normal traffic during seasonal sales.
  environment: >-
    One production Kubernetes cluster (prod-eu1, 48 nodes) running all services,
    managed PostgreSQL 15 behind PgBouncer, Redis 7, Kafka 3.7, OpenSearch 2.x.
    Deploys go through Argo CD; configuration lives in Helm values in the
    platform-config repository.

services:
  - id: web-storefront
    team: Storefront
    language: TypeScript (Next.js, server-side rendering)
    description: Customer-facing website. Renders product, search, cart and checkout pages.
    depends_on: [catalog-api, search-api, checkout-api]
    external: [CDN (edge cache for static assets and images)]
    slo: 99.9% of page renders under 1.5 s (p95)
    config_notes:
      - SSR upstream timeout is 3 s per backend call.
      - Static images are served from the CDN; origin is an object storage bucket.
    known_failure_modes:
      - Slow upstream APIs make server-side rendering time out and return 504.
      - CDN cache rules misconfigured so prices or assets are stale.

  - id: checkout-api
    team: Checkout
    language: Java 21 (Spring Boot)
    description: Cart and checkout orchestration. Holds carts in Redis, reserves stock, takes payment, emits orders.
    depends_on: [inventory-api, payments-api]
    datastores: ["cart-cache: Redis 7, maxmemory 4 GB, maxmemory-policy volatile-lru"]
    slo: 99.95% successful checkout requests; p95 latency under 800 ms
    config_notes:
      - Carts are Redis keys `cart:{session}`; the platform rule is that every key carries a TTL (carts 7 days).
      - Calls inventory-api `GET /v2/availability` before reserving stock and maps the JSON response to a strict DTO (unknown or missing required fields fail deserialization).
    known_failure_modes:
      - Redis memory pressure; behaviour depends on the eviction policy and on keys having TTLs.
      - Downstream schema changes break response parsing.
      - Payment timeouts cause abandoned checkouts.

  - id: payments-api
    team: Payments
    language: Go 1.23
    description: Authorizes and captures card payments through the Paygate payment service provider.
    depends_on: []
    datastores: ["payments-db: PostgreSQL 15 via PgBouncer (transaction pooling)"]
    external: ["Paygate PSP over mutual TLS (client certificate + Paygate server chain verified against a pinned trust bundle)"]
    slo: 99.95% successful authorizations; p99 under 2 s
    config_notes:
      - 6 replicas, each with a database pool of max 20 connections (120 client connections at full load); steady-state peak uses about 40 server connections.
      - PgBouncer `default_pool_size` is the number of real server connections per database/user pair.
      - The Paygate trust bundle is a ConfigMap `paygate-ca-bundle` updated by hand.
      - The Paygate client certificate is issued and renewed by cert-manager (since PM-2025-015).
    known_failure_modes:
      - Connection waits at PgBouncer when client demand exceeds the server pool.
      - TLS failures towards Paygate (expired client certificate, untrusted server chain).
      - Paygate latency spikes.

  - id: inventory-api
    team: Fulfilment
    language: Python 3.12 (FastAPI)
    description: Stock levels and reservations. Serves availability queries and runs the reservation consumer.
    depends_on: [catalog-api]
    datastores: ["inventory-db: PostgreSQL 15", "Kafka topic inventory-reservations (consumer group inventory-reserver, 12 partitions)"]
    slo: availability p95 under 150 ms; reservation lag under 60 s
    config_notes:
      - Reservation consumer settings max.poll.records=500, max.poll.interval.ms=300000 (5 minutes).
      - If one poll batch takes longer than max.poll.interval.ms, the consumer is removed from the group and partitions are rebalanced.
      - Public API `/v2/availability` is consumed by checkout-api.
    known_failure_modes:
      - Slow per-message processing causes rebalance loops and growing consumer lag.
      - Breaking API changes affect checkout-api.

  - id: catalog-api
    team: Catalog
    language: Kotlin (Ktor)
    description: Product, variant and price data; source of truth for the search index.
    depends_on: []
    datastores: ["catalog-db: PostgreSQL 15 (table product_variant ~42M rows)"]
    slo: p95 under 200 ms
    config_notes:
      - Variant lookups by SKU (`WHERE sku = $1`) are the hottest query (cart and checkout pages).
      - Schema migrations are Flyway scripts applied on deploy.
    known_failure_modes:
      - Missing or unusable indexes cause sequential scans on product_variant.
      - Long migrations lock tables.

  - id: search-api
    team: Search
    language: Java 21
    description: Product search and the search-indexer job that writes catalog updates into OpenSearch.
    depends_on: [catalog-api]
    datastores: ["OpenSearch cluster search-prod: 3 data nodes, 500 GB disk each; indices products-*, search-querylog-*"]
    slo: search p95 under 300 ms; catalog changes searchable within 5 minutes
    config_notes:
      - OpenSearch disk watermarks are defaults (low 85%, high 90%, flood_stage 95%).
      - At flood_stage OpenSearch puts index.blocks.read_only_allow_delete on indices with a shard on that node.
      - The query log indices search-querylog-* are managed by an index lifecycle policy (retention setting).
    known_failure_modes:
      - Disk watermarks reached, so shards stay unassigned (high) or indices are write-blocked (flood stage).
      - Indexer backlog makes search results stale.

  - id: order-worker
    team: Fulfilment
    language: Python 3.12
    description: Consumes the orders topic, builds fulfilment documents and pushes them to the warehouse system.
    depends_on: [inventory-api, notification-service]
    datastores: ["Kafka topic orders"]
    slo: orders handed to warehouse within 10 minutes
    config_notes:
      - Kubernetes resources in Helm values `order-worker.resources` (requests and limits).
      - Peak resident memory measured at about 700 MB during sale traffic (PM-2026-005).
    known_failure_modes:
      - OOMKilled (exit code 137) when the memory limit is below peak usage, leading to CrashLoopBackOff.

  - id: notification-service
    team: Customer Comms
    language: Node.js 22
    description: Sends order confirmation and shipping emails through the PostRelay email API.
    depends_on: []
    external: ["PostRelay email API: account limit 100 messages/s; returns HTTP 429 with Retry-After when exceeded"]
    slo: confirmation email sent within 5 minutes of order
    config_notes:
      - Marketing campaigns share the same PostRelay account and limit.
      - Retry policy must honour Retry-After and use exponential backoff with jitter (PM-2026-004).
    known_failure_modes:
      - Provider throttling (429) and retry amplification build a send backlog.

  - id: cluster-dns
    team: Platform
    language: CoreDNS 1.11 (Kubernetes add-on)
    description: In-cluster DNS for service discovery in prod-eu1.
    depends_on: []
    slo: lookup p99 under 50 ms
    config_notes:
      - Pods use the default ndots:5, so one external or partially-qualified lookup can become up to 5 DNS queries.
      - Replica count is managed by the cluster-proportional-autoscaler (min 6).
    known_failure_modes:
      - CoreDNS CPU saturation causes lookup timeouts in every service at once.

