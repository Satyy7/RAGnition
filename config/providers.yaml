# Model provider configuration.
#
# Every model ID and limit below is a starting point that MUST be confirmed against
# your own provider consoles (Groq: console.groq.com -> Settings -> Limits).
# Changing a model or provider is a config edit, never a code change.
#
# rpm / tpm are the limits WE enforce client-side (token bucket). Set them at or
# slightly below the provider's real limits so we slow down before we get 429s.

providers:
  groq:
    kind: openai_compat
    base_url: https://api.groq.com/openai/v1
    api_key_setting: groq_api_key
  gemini:
    kind: openai_compat
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_setting: gemini_api_key
  openrouter:
    kind: openai_compat
    base_url: https://openrouter.ai/api/v1
    api_key_setting: openrouter_api_key
  jina:
    kind: jina
    base_url: https://api.jina.ai/v1
    api_key_setting: jina_api_key
  cohere:
    kind: cohere
    base_url: https://api.cohere.com/v2
    api_key_setting: cohere_api_key
  # On-device ONNX models via fastembed. No key, no quota, no network after the
  # first download (stored in MODEL_CACHE_DIR).
  local:
    kind: local

chains:
  # Tried top to bottom. Groq limits are per model, so falling back to another
  # Groq model often works before we need a different provider.
  # IDs verified 2026-11-17 via `smoke_providers.py --list-models`. Pinned IDs on
  # purpose: aliases like "gemini-flash-latest" change silently and break
  # reproducibility of evaluation results.
  generator:
    - { provider: groq, model: openai/gpt-oss-120b, rpm: 30, tpm: 8000 }
    - { provider: groq, model: qwen/qwen3.8-27b, rpm: 30 }
    - { provider: groq, model: openai/gpt-oss-20b, rpm: 30 }
    # Newest free-tier models get overloaded (503 / slow queueing): short timeouts
    # so we fail over quickly instead of waiting minutes.
    - { provider: gemini, model: gemini-3.8-flash, rpm: 10, timeout_s: 25 }
    - { provider: gemini, model: gemini-3.5-flash, rpm: 10, timeout_s: 25 }
    - { provider: gemini, model: gemma-4-31b-it, rpm: 10, timeout_s: 25 }
    - { provider: openrouter, model: "meta-llama/llama-3.3-70b-instruct:free", rpm: 20, timeout_s: 25 }

  # Judge should come from a DIFFERENT model family than the generator that
  # answered (self-preference bias). Neither entry is gpt-oss. Enforced per
  # eval run in M13.
  # Qwen first: fast, but Groq allows only ~1,000 OUTPUT tokens/min on it (seen
  # 2026-11-24). Gemma (Google) next. Gemini Flash last: from this network it
  # often times out or returns 503 "high demand".
  judge:
    - { provider: groq, model: qwen/qwen3.8-27b, rpm: 30 }
    - { provider: gemini, model: gemma-4-31b-it, rpm: 10, timeout_s: 40 }
    - { provider: gemini, model: gemini-3.8-flash, rpm: 10, timeout_s: 25 }
    - { provider: gemini, model: gemini-3.5-flash, rpm: 10, timeout_s: 25 }

  # Exactly ONE model: vectors from different embedding models live in different
  # spaces and must never be mixed in one index. Changing it = full re-index.
  embedding:
    - { provider: local, model: BAAI/bge-base-en-v1.5, dimensions: 768, batch_size: 64, cache: false }

  # Local cross-encoder first: no quota, reproducible, MIT-licensed, data stays on
  # the machine. The API rerankers are fallbacks and the M7 bake-off contenders
  # (benchmarks pin each one). IDs checked 2026-11-25 against provider docs:
  # Cohere `rerank-v3.5` (docs.cohere.com/v2/docs/rerank), Jina `jina-reranker-v3`
  # (jina.ai/models). If every reranker fails we return the fused order, degraded=true.
  rerank:
    - { provider: local, model: BAAI/bge-reranker-base, cache: false }
    # Jina free tier: 100k tokens/min (seen 2026-11-25); one 30-passage call is ~11k.
    - { provider: jina, model: jina-reranker-v3, rpm: 60, tpm: 80000, timeout_s: 30 }
    - { provider: cohere, model: rerank-v3.5, rpm: 10, timeout_s: 30 }

resilience:
  max_retries_per_model: 1      # retries on the SAME model; more just delays failover
  backoff_base_s: 0.5           # exponential backoff: base * 2^attempt, full jitter
  backoff_max_s: 8.0
  max_inline_wait_s: 5.0        # a 429 asking us to wait <= this: wait and retry same model
  breaker_failure_threshold: 3  # consecutive failures before a model is skipped
  breaker_cooldown_s: 60.0
